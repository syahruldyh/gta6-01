<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURELIA DELTA — Port Aurelia</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101018; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font-size: 13px; }
  #hud.in-title .panel, #hud.in-title .controls, #hud.in-title .floats, #hud.in-title .location-card { display: none; }
  .panel { position: absolute; background: rgba(8, 10, 18, 0.72); border: 1px solid rgba(255, 210, 31, 0.35); border-radius: 6px; padding: 7px 10px; text-shadow: 0 1px 2px #000; }
  .mission { top: 12px; left: 12px; width: 330px; }
  .mtitle { font-weight: 800; color: #ffd21f; font-size: 15px; letter-spacing: 0.5px; }
  .mobj { margin-top: 3px; font-size: 13px; }
  .mnext { margin-top: 2px; color: #9fd8e8; font-size: 12px; }
  .apd { top: 108px; left: 12px; width: 300px; font-size: 12px; }
  .atitle { font-weight: 800; color: #6aa8ff; }
  .aunits { margin-top: 3px; line-height: 1.5; }
  .topright { top: 12px; right: 12px; text-align: right; width: 220px; }
  .clock { font-size: 13px; color: #ffd21f; font-weight: 700; }
  .money { font-size: 20px; font-weight: 800; }
  .stars { font-size: 18px; color: #ff3b30; letter-spacing: 2px; }
  .tide { font-size: 13px; color: #7fe3ff; font-weight: 700; }
  .insight { font-size: 11px; color: #ffb0a0; }
  .weapons { top: 148px; right: 12px; font-size: 12px; }
  .wslot { padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-left: 4px; }
  .wslot.sel { background: #ffd21f; color: #111; font-weight: 800; }
  .minimap-box { bottom: 44px; left: 12px; width: 180px; }
  .minimap-box canvas { width: 168px; height: 168px; border-radius: 50%; border: 2px solid rgba(255,210,31,0.5); background: #20242a; }
  .district { font-weight: 800; color: #ffd21f; margin-top: 4px; font-size: 13px; }
  .vitals { font-size: 11px; line-height: 1.5; }
  .dialog { bottom: 44px; left: 50%; transform: translateX(-50%); width: 480px; opacity: 0; transition: opacity 0.4s; }
  .dname { color: #ffd21f; font-weight: 800; font-size: 12px; }
  .dtext { font-size: 14px; font-style: italic; margin-top: 2px; }
  .vehicle { bottom: 44px; right: 12px; width: 250px; text-align: right; }
  .radio { color: #9fd8e8; font-size: 12px; }
  .carname { font-weight: 800; font-size: 14px; margin-top: 2px; }
  .cond { font-size: 12px; color: #c8c8c8; }
  .speed { font-size: 30px; font-weight: 800; color: #fff; }
  .floats { position: absolute; top: 38%; left: 50%; transform: translateX(-50%); text-align: center; }
  .float-line { font-size: 20px; font-weight: 800; color: #ffd21f; text-shadow: 0 2px 4px #000; margin: 2px 0; animation: floatup 2.6s forwards; }
  @keyframes floatup { from { opacity: 1; } to { opacity: 0; transform: translateY(-18px); } }
  .controls { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #c8c8d8; background: rgba(8,10,18,0.6); padding: 4px 12px; border-radius: 4px; white-space: nowrap; }
  .location-card { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 3px 8px #000; opacity: 0; transition: opacity 0.5s; }
  .title-screen, .pause-screen, .over-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,10,25,0.25), rgba(10,10,25,0.75)); pointer-events: auto; }
  .pause-screen, .over-screen { display: none; }
  .gametitle { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd21f; text-shadow: 0 4px 16px #000; }
  .gametitle.small { font-size: 52px; }
  .gamesub { font-size: 18px; letter-spacing: 4px; color: #fff; margin-top: 6px; }
  .gamefeat { font-size: 15px; color: #9fd8e8; margin-top: 10px; letter-spacing: 2px; }
  .menu { margin-top: 26px; display: flex; gap: 12px; }
  .menu button { pointer-events: auto; cursor: pointer; font-size: 16px; font-weight: 800; padding: 10px 26px; border-radius: 6px; border: 2px solid #ffd21f; background: rgba(255,210,31,0.15); color: #ffd21f; }
  .menu button:hover { background: #ffd21f; color: #111; }
  .menulist { margin-top: 16px; font-size: 13px; color: #c8c8d8; letter-spacing: 2px; }
  .menunote { margin-top: 18px; font-size: 13px; color: #e8e8e8; max-width: 520px; text-align: center; line-height: 1.5; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
